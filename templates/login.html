<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='favico.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Resource Planner - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#0d9488',
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full font-sans">
    <div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-teal-50/40 flex flex-col">
        <!-- Accent brush line -->
        <div class="accent-brush-line"></div>

        <div class="flex-1 flex flex-col md:flex-row">
            <!-- Login Form -->
            <div class="w-full md:w-1/2 flex items-center justify-center p-8">
                <form method="POST" class="w-full max-w-md space-y-6">
                    <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8 space-y-6">
                        <!-- Logo -->
                        <div class="flex justify-center mb-2">
                            <img src="{{ url_for('static', filename='logo.png') }}" alt="Resource Planner" class="h-12 w-auto object-contain">
                        </div>

                        <div class="space-y-1 text-center">
                            <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
                            <p class="text-slate-500 text-sm">Sign in to your account</p>
                        </div>

                        <div class="space-y-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                                <input type="text" name="username" required
                                       class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm
                                              focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
                                              transition-all placeholder-slate-400"
                                       placeholder="Enter your username">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                                <input type="password" name="password" required
                                       class="w-full px-4 py-2.5 border border-slate-200 rounded-lg text-sm
                                              focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
                                              transition-all placeholder-slate-400"
                                       placeholder="Enter your password">
                            </div>
                        </div>

                        <button type="submit" class="btn-primary w-full py-2.5">
                            Sign in
                        </button>

                        {% if error %}
                        <div class="alert-error p-3 rounded-lg flex items-center gap-2 text-sm">
                            <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            {{ error }}
                        </div>
                        {% endif %}
                    </div>
                </form>
            </div>

            <!-- Illustration (desktop only) -->
            <div class="w-0 md:w-1/2 hidden md:flex items-center justify-center p-8" style="max-width: 600px;">
                <img src="{{ url_for('static', filename='illustration.svg') }}"
                     alt="Login illustration"
                     class="w-full h-auto max-h-96 object-contain opacity-90">
            </div>
        </div>
    </div>
</body>
</html>
