<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='favico.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Resource Planner - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#0d9488',
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full font-sans">
    <div class="min-h-screen bg-gradient-to-br from-slate-50 via-blue-50/30 to-teal-50/40 flex flex-col">
        <!-- Accent brush line -->
        <div class="accent-brush-line"></div>

        <div class="flex-1 flex flex-col lg:flex-row max-w-6xl mx-auto w-full">
            <!-- Left: Login Form -->
            <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-10">
                <div class="w-full max-w-md">
                    <!-- Card -->
                    <form method="POST" class="bg-white rounded-2xl shadow-lg border border-slate-200/80 overflow-hidden">
                        <div class="p-8 space-y-6">
                            <!-- Logo -->
                            <div class="flex justify-center -my-6">
                                <img src="{{ url_for('static', filename='logo.png') }}" alt="Resource Planner" class="h-32 w-auto object-contain">
                            </div>

                            <div class="text-center">
                                <h1 class="text-2xl font-bold text-slate-900">Welcome Back</h1>
                                <p class="text-slate-400 text-sm mt-1">Sign in to manage your resources</p>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Username</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                            <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                            </svg>
                                        </div>
                                        <input type="text" name="username" required autofocus
                                               class="w-full pl-10 pr-4 py-2.5 border border-slate-200 rounded-lg text-sm
                                                      focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
                                                      transition-all placeholder-slate-400"
                                               placeholder="Enter your username">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-700 mb-1.5">Password</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                                            <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                            </svg>
                                        </div>
                                        <input type="password" name="password" required id="passwordInput"
                                               class="w-full pl-10 pr-10 py-2.5 border border-slate-200 rounded-lg text-sm
                                                      focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary
                                                      transition-all placeholder-slate-400"
                                               placeholder="Enter your password">
                                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600">
                                            <svg id="eyeIcon" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                                            </svg>
                                            <svg id="eyeOffIcon" class="h-4 w-4 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                                            </svg>
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {% if error %}
                            <div class="alert-error p-3 rounded-lg flex items-center gap-2 text-sm">
                                <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                {{ error }}
                            </div>
                            {% endif %}
                        </div>

                        <!-- Submit Footer -->
                        <div class="px-8 py-5 bg-slate-50/60 border-t border-slate-100">
                            <button type="submit" class="btn-primary w-full py-2.5 text-sm">
                                <svg class="w-4 h-4 mr-1.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                                </svg>
                                Sign in
                            </button>
                        </div>
                    </form>

                    <!-- Footer text -->
                    <p class="text-center text-xs text-slate-400 mt-6">&copy; 2025 Resource Planner</p>
                </div>
            </div>

            <!-- Right: Illustration (desktop only) -->
            <div class="hidden lg:flex lg:w-1/2 items-center justify-center p-10">
                <div class="max-w-lg w-full">
                    <img src="{{ url_for('static', filename='illustration.svg') }}"
                         alt="Login illustration"
                         class="w-full h-auto object-contain opacity-90">
                    <div class="mt-8 text-center">
                        <h2 class="text-xl font-semibold text-slate-700">Plan. Allocate. Deliver.</h2>
                        <p class="text-slate-400 text-sm mt-2 max-w-sm mx-auto">
                            Visualise resource allocation, track project timelines, and optimise team utilisation — all in one place.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            var input = document.getElementById('passwordInput');
            var eyeOn = document.getElementById('eyeIcon');
            var eyeOff = document.getElementById('eyeOffIcon');
            if (input.type === 'password') {
                input.type = 'text';
                eyeOn.classList.add('hidden');
                eyeOff.classList.remove('hidden');
            } else {
                input.type = 'password';
                eyeOn.classList.remove('hidden');
                eyeOff.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
