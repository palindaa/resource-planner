{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
    <div class="mb-8 border-b pb-4">
        <h1 class="text-3xl font-bold text-slate-800">Edit Project</h1>
    </div>
    
    <form id="editProjectForm" method="POST" class="mb-12 bg-slate-50 rounded-xl p-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Project Name</label>
                <input type="text" name="name" required value="{{ project.name }}"
                       class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Description</label>
                <textarea name="description" rows="3"
                          class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all">{{ project.description }}</textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Project Color</label>
                <input type="color" name="color" value="{{ project.color }}" required
                       class="w-full h-11 rounded-lg cursor-pointer">
                <p class="mt-1 text-xs text-slate-500">Select a color for the Gantt chart</p>
            </div>
        </div>
        
        <div class="flex space-x-4">
            <button type="button" id="showConfirmation"
                    class="inline-flex items-center px-6 py-3 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
                Save Changes
            </button>
            <a href="{{ url_for('projects') }}" 
               class="inline-flex items-center px-6 py-3 border border-slate-300 text-sm font-medium rounded-md text-slate-700 bg-white hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                Cancel
            </a>
        </div>
    </form>
</div>

<!-- Edit Confirmation Modal -->
<div id="editConfirmModal" class="hidden fixed inset-0 bg-slate-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 flex items-center justify-center">
    <div class="relative p-5 border w-96 shadow-sm border border-slate-200 rounded-md bg-white">
        <div class="mt-3 text-center">
            <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-blue-100">
                <svg class="h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
            </div>
            <h3 class="text-lg leading-6 font-medium text-slate-900 mt-2">Confirm Changes</h3>
            <div class="mt-2 px-7 py-3">
                <p class="text-sm text-slate-500">
                    Are you sure you want to update this project with the new information?
                </p>
            </div>
            <div class="items-center px-4 py-3">
                <button id="confirmEdit" class="px-4 py-2 bg-blue-600 text-white text-base font-medium rounded-md w-24 shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    Confirm
                </button>
                <button id="cancelEdit" class="ml-2 px-4 py-2 bg-slate-100 text-slate-700 text-base font-medium rounded-md w-24 shadow-sm hover:bg-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-500">
                    Cancel
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const editForm = document.getElementById('editProjectForm');
        const confirmModal = document.getElementById('editConfirmModal');
        const showConfirmBtn = document.getElementById('showConfirmation');
        const confirmEditBtn = document.getElementById('confirmEdit');
        const cancelEditBtn = document.getElementById('cancelEdit');
        
        // Show confirmation modal when button is clicked
        showConfirmBtn.addEventListener('click', function() {
            confirmModal.classList.remove('hidden');
        });
        
        // Hide modal when cancel button is clicked
        cancelEditBtn.addEventListener('click', function() {
            confirmModal.classList.add('hidden');
        });
        
        // Submit form when confirmed
        confirmEditBtn.addEventListener('click', function() {
            editForm.submit();
        });
        
        // Close modal if user clicks outside of it
        window.addEventListener('click', function(event) {
            if (event.target == confirmModal) {
                confirmModal.classList.add('hidden');
            }
        });
    });
</script>
{% endblock %}
