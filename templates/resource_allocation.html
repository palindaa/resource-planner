{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
    <div class="mb-6 border-b pb-4">
        <h1 class="text-3xl font-bold text-slate-800">Resource Allocation</h1>
        <p class="mt-1 text-sm text-slate-500">Interactive timeline of employee project assignments</p>
    </div>

    <!-- Filters -->
    <div class="bg-slate-50 rounded-xl p-5 mb-6">
        <div class="flex flex-wrap items-end gap-4">
            <!-- Employee Search -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Employee</label>
                <input type="text" id="tlEmployeeFilter" placeholder="Search by name..."
                       class="w-52 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder-slate-400">
            </div>

            <!-- Department Filter -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Department</label>
                <select id="tlDeptFilter"
                        class="w-44 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="">All Departments</option>
                </select>
            </div>

            <!-- Project Status Filter -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Status</label>
                <select id="tlStatusFilter"
                        class="w-40 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="all">All Projects</option>
                    <option value="active" selected>Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <!-- Intern Filter -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Type</label>
                <select id="tlInternFilter"
                        class="w-36 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="all">All</option>
                    <option value="intern">Interns</option>
                    <option value="non_intern">Non-Interns</option>
                </select>
            </div>

            <!-- Project Filter -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Project</label>
                <select id="tlProjectFilter"
                        class="w-52 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="">All Projects</option>
                </select>
            </div>

            <!-- Date Range -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">From</label>
                <input type="date" id="tlStartDate"
                       class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">To</label>
                <input type="date" id="tlEndDate"
                       class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            </div>

            <button onclick="resetTimelineFilters()"
                    class="px-4 py-2 bg-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-300 transition-colors">
                Reset
            </button>
        </div>

        <!-- Summary -->
        <div class="mt-3 flex items-center gap-4 text-xs text-slate-400">
            <span id="tlSummary"></span>
        </div>
    </div>

    <!-- Add Assignment Button -->
    <div class="mb-4">
        <button onclick="openAddModal()"
                class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-primary bg-primary-50 rounded-lg hover:bg-primary-100 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Assignment
        </button>
    </div>

    <!-- Timeline Chart -->
    <style>
        #timelineChart .apexcharts-rangebar-area { cursor: pointer; }
        #timelineChart .apexcharts-tooltip {
            transform: translateY(150px);
        }
    </style>
    <div id="timelineLegend" class="flex flex-wrap gap-x-4 gap-y-2 mb-4"></div>
    <div id="timelineChart"></div>

    {% if not users %}
        <p class="text-slate-400 text-center py-12 text-sm">No assignments found for active users.</p>
    {% endif %}
</div>

<!-- Edit Assignment Modal -->
<div id="editModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" id="editModalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md relative">
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
                <div>
                    <h3 class="text-lg font-semibold text-slate-800">Edit Assignment</h3>
                    <p class="text-xs text-slate-400 mt-0.5" id="modalSubtitle"></p>
                </div>
                <button onclick="closeEditModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="px-6 py-5 space-y-4">
                <!-- Info -->
                <div class="bg-slate-50 rounded-lg p-3 flex items-start gap-3">
                    <div class="w-3 h-3 rounded-sm mt-0.5 flex-shrink-0" id="modalColorDot"></div>
                    <div>
                        <div class="text-sm font-medium text-slate-700" id="modalEmployee"></div>
                        <div class="text-xs text-slate-500" id="modalProject"></div>
                    </div>
                </div>

                <!-- Date Fields -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Start Date</label>
                        <input type="date" id="modalStartDate"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">End Date</label>
                        <input type="date" id="modalEndDate"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    </div>
                </div>

                <!-- Duration display -->
                <div class="text-xs text-slate-400" id="modalDuration"></div>

                <!-- Error message -->
                <div id="modalError" class="hidden alert-error p-3 rounded-lg text-sm flex items-center gap-2">
                    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span id="modalErrorText"></span>
                </div>
            </div>

            <!-- Footer -->
            <div class="px-6 py-4 bg-slate-50/60 border-t border-slate-100 flex items-center justify-between">
                <button onclick="deleteAssignment()" id="modalDeleteBtn"
                        class="inline-flex items-center gap-1.5 px-3 py-2 text-xs font-medium text-red-600 bg-red-50 rounded-lg hover:bg-red-100 transition-colors">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                    </svg>
                    Delete
                </button>
                <div class="flex items-center gap-2">
                    <button onclick="closeEditModal()"
                            class="px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                        Cancel
                    </button>
                    <button onclick="saveAssignment()" id="modalSaveBtn"
                            class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-700 transition-colors">
                        Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Add Assignment Modal -->
<div id="addModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/30 backdrop-blur-sm" id="addModalOverlay"></div>
    <div class="absolute inset-0 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 w-full max-w-md relative">
            <!-- Header -->
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
                <div>
                    <h3 class="text-lg font-semibold text-slate-800">New Assignment</h3>
                    <p class="text-xs text-slate-400 mt-0.5">Assign an employee to a project</p>
                </div>
                <button onclick="closeAddModal()" class="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors">
                    <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="px-6 py-5 space-y-4">
                <!-- Employee -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Employee</label>
                    <select id="addUserId"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        <option value="">Select an employee</option>
                        {% for u in active_users %}
                        <option value="{{ u.id }}">{{ u.name }} ({{ u.department }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Project -->
                <div>
                    <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Project</label>
                    <select id="addProjectId"
                            class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                        <option value="">Select a project</option>
                        {% for p in active_projects %}
                        <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Dates -->
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Start Date</label>
                        <input type="date" id="addStartDate"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">End Date</label>
                        <input type="date" id="addEndDate"
                               class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    </div>
                </div>

                <!-- Error -->
                <div id="addModalError" class="hidden alert-error p-3 rounded-lg text-sm flex items-center gap-2">
                    <svg class="h-4 w-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                    <span id="addModalErrorText"></span>
                </div>
            </div>

            <!-- Footer -->
            <div class="px-6 py-4 bg-slate-50/60 border-t border-slate-100 flex items-center justify-end gap-2">
                <button onclick="closeAddModal()"
                        class="px-4 py-2 text-sm font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                    Cancel
                </button>
                <button onclick="createAssignment()" id="addSaveBtn"
                        class="px-4 py-2 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary-700 transition-colors">
                    Create Assignment
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {

    var rawUsers = {{ users|tojson|safe }};
    var timelineInstance = null;

    // ── Default date range: last 30 days → next 60 days ──
    function toISODate(d) { return d.toISOString().split('T')[0]; }
    var today = new Date();
    var defaultStart = new Date(today); defaultStart.setDate(today.getDate() - 30);
    var defaultEnd = new Date(today); defaultEnd.setDate(today.getDate() + 60);
    document.getElementById('tlStartDate').value = toISODate(defaultStart);
    document.getElementById('tlEndDate').value = toISODate(defaultEnd);

    // ── Collect unique departments and projects for filter dropdowns ──
    var departments = {};
    var projects = {};
    rawUsers.forEach(function(u) {
        departments[u.department] = true;
        u.tasks.forEach(function(t) {
            projects[t.name] = t.color;
        });
    });

    // Populate department dropdown
    var deptSelect = document.getElementById('tlDeptFilter');
    Object.keys(departments).sort().forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d; opt.textContent = d;
        deptSelect.appendChild(opt);
    });

    // Populate project dropdown
    var projSelect = document.getElementById('tlProjectFilter');
    Object.keys(projects).sort().forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        projSelect.appendChild(opt);
    });

    // ── Build chart data from filtered users ──
    function buildChartData() {
        var empFilter = document.getElementById('tlEmployeeFilter').value.toLowerCase();
        var deptFilter = document.getElementById('tlDeptFilter').value;
        var statusFilter = document.getElementById('tlStatusFilter').value;
        var projFilter = document.getElementById('tlProjectFilter').value;
        var startFilter = document.getElementById('tlStartDate').value;
        var endFilter = document.getElementById('tlEndDate').value;

        var internFilter = document.getElementById('tlInternFilter').value;

        // Filter users
        var filtered = rawUsers.filter(function(u) {
            if (deptFilter && u.department !== deptFilter) return false;
            if (empFilter && u.name.toLowerCase().indexOf(empFilter) === -1) return false;
            if (internFilter === 'intern' && !u.is_intern) return false;
            if (internFilter === 'non_intern' && u.is_intern) return false;
            return true;
        });

        // Sort users by department first, then by name
        filtered.sort(function(a, b) {
            if (a.department < b.department) return -1;
            if (a.department > b.department) return 1;
            if (a.name < b.name) return -1;
            if (a.name > b.name) return 1;
            return 0;
        });

        // Build series grouped by project
        var projectSeriesMap = {};
        var employeeSet = {};
        var sortedCategories = [];
        var totalAssignments = 0;

        filtered.forEach(function(user) {
            var label = user.name + ' (' + user.department + ')' + (user.is_intern ? ' [Intern]' : '');

            user.tasks.forEach(function(task) {
                // Status filter
                if (statusFilter === 'active' && task.status !== 'Started') return;
                if (statusFilter === 'inactive' && task.status === 'Started') return;

                // Project filter
                if (projFilter && task.name !== projFilter) return;

                var taskStart = task.start;
                var taskEnd = task.end;

                // Date range filter: skip if assignment doesn't overlap with filter range
                if (startFilter && taskEnd < startFilter) return;
                if (endFilter && taskStart > endFilter) return;

                if (!projectSeriesMap[task.name]) {
                    projectSeriesMap[task.name] = {
                        name: task.name,
                        color: task.color,
                        data: []
                    };
                }

                projectSeriesMap[task.name].data.push({
                    x: label,
                    y: [new Date(taskStart).getTime(), new Date(taskEnd).getTime()],
                    fillColor: task.color,
                    assignmentId: task.assignment_id
                });

                if (!employeeSet[label]) {
                    employeeSet[label] = true;
                    sortedCategories.push(label);
                }
                totalAssignments++;
            });
        });

        var series = Object.keys(projectSeriesMap).map(function(k) {
            return projectSeriesMap[k];
        });

        var employeeCount = sortedCategories.length;

        // Update summary
        document.getElementById('tlSummary').textContent =
            employeeCount + ' employee' + (employeeCount !== 1 ? 's' : '') +
            ' \u00B7 ' + totalAssignments + ' assignment' + (totalAssignments !== 1 ? 's' : '') +
            ' \u00B7 ' + series.length + ' project' + (series.length !== 1 ? 's' : '');

        return { series: series, employeeCount: employeeCount, categories: sortedCategories };
    }

    // ── Render the timeline ──
    function renderTimeline() {
        var result = buildChartData();
        var series = result.series;
        var employeeCount = result.employeeCount;
        var categories = result.categories;

        if (timelineInstance) timelineInstance.destroy();

        var el = document.getElementById('timelineChart');

        if (series.length === 0 || employeeCount === 0) {
            el.innerHTML = '<div class="flex flex-col items-center justify-center py-16 text-slate-400">' +
                '<svg class="h-10 w-10 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>' +
                '<p class="text-sm">No assignments match the current filters</p></div>';
            return;
        }

        // Dynamic height: ~45px per employee row + padding for legend/axis
        var chartHeight = Math.max(300, employeeCount * 50 + 120);

        // Extract colors in series order
        var seriesColors = series.map(function(s) { return s.color || '#0d9488'; });

        timelineInstance = new ApexCharts(el, {
            chart: {
                type: 'rangeBar',
                height: chartHeight,
                fontFamily: 'Inter, system-ui, sans-serif',
                toolbar: {
                    show: true,
                    tools: {
                        download: true,
                        selection: false,
                        zoom: true,
                        zoomin: true,
                        zoomout: true,
                        pan: true,
                        reset: true
                    }
                },
                zoom: { enabled: true, allowMouseWheelZoom: false },
                events: {
                    dataPointSelection: function(event, chartContext, config) {
                        var dataPoint = config.w.config.series[config.seriesIndex].data[config.dataPointIndex];
                        var seriesName = config.w.config.series[config.seriesIndex].name;
                        var color = dataPoint.fillColor || config.w.config.colors[config.seriesIndex];
                        if (dataPoint && dataPoint.assignmentId) {
                            openEditModal(dataPoint.assignmentId, dataPoint.x, seriesName, color);
                        }
                    }
                },
                animations: {
                    enabled: true,
                    easing: 'easeinout',
                    speed: 400
                }
            },
            plotOptions: {
                bar: {
                    horizontal: true,
                    barHeight: '60%',
                    rangeBarGroupRows: true,
                    borderRadius: 4
                }
            },
            series: series,
            colors: seriesColors,
            xaxis: {
                type: 'datetime',
                labels: {
                    style: { colors: '#94a3b8', fontSize: '11px' },
                    datetimeFormatter: { month: 'MMM \'yy', day: 'dd MMM' }
                },
                axisBorder: { color: '#e2e8f0' },
                axisTicks: { color: '#e2e8f0' }
            },
            yaxis: {
                categories: categories,
                labels: {
                    style: { colors: '#475569', fontSize: '12px', fontWeight: 500 },
                    maxWidth: 200
                }
            },
            grid: {
                borderColor: '#f1f5f9',
                xaxis: { lines: { show: true } },
                yaxis: { lines: { show: false } },
                padding: { left: 10, right: 20 }
            },
            legend: {
                show: false
            },
            tooltip: {
                custom: function(opts) {
                    var seriesName = opts.w.config.series[opts.seriesIndex].name;
                    var data = opts.w.config.series[opts.seriesIndex].data[opts.dataPointIndex];
                    var employee = data.x;
                    var start = new Date(data.y[0]);
                    var end = new Date(data.y[1]);
                    var days = Math.round((end - start) / 86400000);
                    var color = data.fillColor || opts.w.config.colors[opts.seriesIndex];

                    var startStr = start.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                    var endStr = end.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

                    return '<div style="padding:12px 16px; font-size:13px; line-height:1.6; font-family:Inter,system-ui,sans-serif;">' +
                        '<div style="font-weight:600; color:#1e293b; margin-bottom:6px;">' + employee + '</div>' +
                        '<div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">' +
                            '<span style="width:8px;height:8px;border-radius:2px;background:' + color + ';display:inline-block;"></span>' +
                            '<span style="color:#475569;">' + seriesName + '</span>' +
                        '</div>' +
                        '<div style="color:#94a3b8; font-size:12px;">' +
                            startStr + ' &rarr; ' + endStr +
                            '<span style="margin-left:8px; color:#64748b; font-weight:500;">' + days + ' days</span>' +
                        '</div>' +
                        '<div style="margin-top:6px; padding-top:6px; border-top:1px solid #e2e8f0; color:#0d9488; font-size:11px; font-weight:500;">Click to edit assignment</div>' +
                    '</div>';
                }
            },
            dataLabels: {
                enabled: true,
                formatter: function(val, opts) {
                    return opts.w.config.series[opts.seriesIndex].name;
                },
                style: {
                    fontSize: '11px',
                    fontWeight: 500,
                    fontFamily: 'Inter, system-ui, sans-serif',
                    colors: ['#fff']
                },
                dropShadow: { enabled: false }
            },
            stroke: { width: 0 }
        });
        timelineInstance.render();

        // Build custom legend
        var legendEl = document.getElementById('timelineLegend');
        legendEl.innerHTML = '';
        series.forEach(function(s) {
            var item = document.createElement('div');
            item.className = 'flex items-center gap-1.5 text-xs text-slate-600';
            item.innerHTML = '<span class="inline-block w-2.5 h-2.5 rounded-sm flex-shrink-0" style="background:' + (s.color || '#0d9488') + '"></span>' +
                             '<span class="whitespace-nowrap">' + s.name + '</span>';
            legendEl.appendChild(item);
        });
    }

    // ── Filter event listeners ──
    var debounceTimer;
    document.getElementById('tlEmployeeFilter').addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(renderTimeline, 300);
    });
    document.getElementById('tlDeptFilter').addEventListener('change', renderTimeline);
    document.getElementById('tlStatusFilter').addEventListener('change', renderTimeline);
    document.getElementById('tlInternFilter').addEventListener('change', renderTimeline);
    document.getElementById('tlProjectFilter').addEventListener('change', renderTimeline);
    document.getElementById('tlStartDate').addEventListener('change', renderTimeline);
    document.getElementById('tlEndDate').addEventListener('change', renderTimeline);

    function resetTimelineFilters() {
        document.getElementById('tlEmployeeFilter').value = '';
        document.getElementById('tlDeptFilter').value = '';
        document.getElementById('tlStatusFilter').value = 'active';
        document.getElementById('tlInternFilter').value = 'all';
        document.getElementById('tlProjectFilter').value = '';
        document.getElementById('tlStartDate').value = toISODate(defaultStart);
        document.getElementById('tlEndDate').value = toISODate(defaultEnd);
        renderTimeline();
    }
    window.resetTimelineFilters = resetTimelineFilters;

    // ── Edit Modal ──
    var currentAssignmentId = null;

    function openEditModal(assignmentId, employee, project, color) {
        currentAssignmentId = assignmentId;
        var modal = document.getElementById('editModal');
        var errorEl = document.getElementById('modalError');
        errorEl.classList.add('hidden');

        // Show modal immediately with loading state
        document.getElementById('modalEmployee').textContent = employee;
        document.getElementById('modalProject').textContent = project;
        document.getElementById('modalColorDot').style.backgroundColor = color;
        document.getElementById('modalSubtitle').textContent = 'Loading...';
        document.getElementById('modalStartDate').value = '';
        document.getElementById('modalEndDate').value = '';
        document.getElementById('modalDuration').textContent = '';
        modal.classList.remove('hidden');

        // Fetch assignment data
        fetch('/api/assignment/' + assignmentId)
            .then(function(r) { return r.json(); })
            .then(function(data) {
                document.getElementById('modalStartDate').value = data.start_date;
                document.getElementById('modalEndDate').value = data.end_date;
                document.getElementById('modalSubtitle').textContent = data.start_date + ' \u2192 ' + data.end_date;
                updateDuration();
            })
            .catch(function() {
                document.getElementById('modalSubtitle').textContent = 'Failed to load';
            });
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.add('hidden');
        currentAssignmentId = null;
    }

    function updateDuration() {
        var start = document.getElementById('modalStartDate').value;
        var end = document.getElementById('modalEndDate').value;
        var el = document.getElementById('modalDuration');
        if (start && end) {
            var days = Math.round((new Date(end) - new Date(start)) / 86400000);
            el.textContent = days + ' day' + (days !== 1 ? 's' : '') + ' duration';
        } else {
            el.textContent = '';
        }
    }

    document.getElementById('modalStartDate').addEventListener('change', updateDuration);
    document.getElementById('modalEndDate').addEventListener('change', updateDuration);
    document.getElementById('editModalOverlay').addEventListener('click', closeEditModal);

    // Escape key handled in add modal section below

    function saveAssignment() {
        var start = document.getElementById('modalStartDate').value;
        var end = document.getElementById('modalEndDate').value;
        var errorEl = document.getElementById('modalError');
        var errorText = document.getElementById('modalErrorText');

        if (!start || !end) {
            errorText.textContent = 'Both dates are required.';
            errorEl.classList.remove('hidden');
            return;
        }
        if (start > end) {
            errorText.textContent = 'Start date must be before end date.';
            errorEl.classList.remove('hidden');
            return;
        }

        errorEl.classList.add('hidden');
        var btn = document.getElementById('modalSaveBtn');
        btn.textContent = 'Saving...';
        btn.disabled = true;

        fetch('/api/assignment/' + currentAssignmentId, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ start_date: start, end_date: end })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                // Update local data and re-render
                rawUsers.forEach(function(u) {
                    u.tasks.forEach(function(t) {
                        if (t.assignment_id === currentAssignmentId) {
                            t.start = start;
                            t.end = end;
                        }
                    });
                });
                closeEditModal();
                renderTimeline();
            }
        })
        .catch(function() {
            errorText.textContent = 'Failed to save. Please try again.';
            errorEl.classList.remove('hidden');
        })
        .finally(function() {
            btn.textContent = 'Save Changes';
            btn.disabled = false;
        });
    }

    function deleteAssignment() {
        if (!confirm('Are you sure you want to delete this assignment?')) return;

        var btn = document.getElementById('modalDeleteBtn');
        btn.textContent = 'Deleting...';
        btn.disabled = true;

        fetch('/api/assignment/' + currentAssignmentId + '/delete', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                // Remove from local data
                rawUsers.forEach(function(u) {
                    u.tasks = u.tasks.filter(function(t) {
                        return t.assignment_id !== currentAssignmentId;
                    });
                });
                closeEditModal();
                renderTimeline();
            }
        })
        .catch(function() {
            alert('Failed to delete. Please try again.');
        })
        .finally(function() {
            btn.innerHTML = '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg> Delete';
            btn.disabled = false;
        });
    }

    window.openEditModal = openEditModal;
    window.closeEditModal = closeEditModal;
    window.saveAssignment = saveAssignment;
    window.deleteAssignment = deleteAssignment;

    // ── Add Assignment Modal ──
    function openAddModal() {
        document.getElementById('addUserId').value = '';
        document.getElementById('addProjectId').value = '';
        document.getElementById('addStartDate').value = '';
        document.getElementById('addEndDate').value = '';
        document.getElementById('addModalError').classList.add('hidden');
        document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
        document.getElementById('addModal').classList.add('hidden');
        addModalUserId = null;
    }

    document.getElementById('addModalOverlay').addEventListener('click', closeAddModal);
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeAddModal();
            closeEditModal();
        }
    });

    function createAssignment() {
        var userId = document.getElementById('addUserId').value;
        var projectId = document.getElementById('addProjectId').value;
        var start = document.getElementById('addStartDate').value;
        var end = document.getElementById('addEndDate').value;
        var errorEl = document.getElementById('addModalError');
        var errorText = document.getElementById('addModalErrorText');

        if (!userId) {
            errorText.textContent = 'Please select an employee.';
            errorEl.classList.remove('hidden');
            return;
        }
        if (!projectId) {
            errorText.textContent = 'Please select a project.';
            errorEl.classList.remove('hidden');
            return;
        }
        if (!start || !end) {
            errorText.textContent = 'Both dates are required.';
            errorEl.classList.remove('hidden');
            return;
        }
        if (start > end) {
            errorText.textContent = 'Start date must be before end date.';
            errorEl.classList.remove('hidden');
            return;
        }

        errorEl.classList.add('hidden');
        var btn = document.getElementById('addSaveBtn');
        btn.textContent = 'Creating...';
        btn.disabled = true;

        fetch('/api/assignment', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                user_id: parseInt(userId),
                project_id: parseInt(projectId),
                start_date: start,
                end_date: end
            })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.success) {
                // Add to local data
                var a = data.assignment;
                var found = false;
                rawUsers.forEach(function(u) {
                    if (u.name === a.username && u.department === a.department) {
                        u.tasks.push({
                            assignment_id: a.assignment_id,
                            name: a.project_name,
                            start: a.start_date,
                            end: a.end_date,
                            color: a.project_color,
                            status: a.project_status
                        });
                        found = true;
                    }
                });
                // If user wasn't in rawUsers yet (had no assignments), add them
                if (!found) {
                    rawUsers.push({
                        user_id: parseInt(userId),
                        name: a.username,
                        department: a.department,
                        tasks: [{
                            assignment_id: a.assignment_id,
                            name: a.project_name,
                            start: a.start_date,
                            end: a.end_date,
                            color: a.project_color,
                            status: a.project_status
                        }]
                    });
                }
                closeAddModal();
                renderTimeline();
            }
        })
        .catch(function() {
            errorText.textContent = 'Failed to create. Please try again.';
            errorEl.classList.remove('hidden');
        })
        .finally(function() {
            btn.textContent = 'Create Assignment';
            btn.disabled = false;
        });
    }

    window.openAddModal = openAddModal;
    window.closeAddModal = closeAddModal;
    window.createAssignment = createAssignment;

    // Initial render
    if (rawUsers.length > 0) {
        renderTimeline();
    }
});
</script>
{% endblock %}
