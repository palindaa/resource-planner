{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
    <div class="mb-6 border-b pb-4">
        <h1 class="text-3xl font-bold text-slate-800">Resource Allocation</h1>
        <p class="mt-1 text-sm text-slate-500">Interactive timeline of employee project assignments</p>
    </div>

    <!-- Filters -->
    <div class="bg-slate-50 rounded-xl p-5 mb-6">
        <div class="flex flex-wrap items-end gap-4">
            <!-- Employee Search -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Employee</label>
                <input type="text" id="tlEmployeeFilter" placeholder="Search by name..."
                       class="w-52 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary placeholder-slate-400">
            </div>

            <!-- Department Filter -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Department</label>
                <select id="tlDeptFilter"
                        class="w-44 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="">All Departments</option>
                </select>
            </div>

            <!-- Project Status Filter -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Status</label>
                <select id="tlStatusFilter"
                        class="w-40 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="all">All Projects</option>
                    <option value="active" selected>Active</option>
                    <option value="inactive">Inactive</option>
                </select>
            </div>

            <!-- Project Filter -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">Project</label>
                <select id="tlProjectFilter"
                        class="w-52 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
                    <option value="">All Projects</option>
                </select>
            </div>

            <!-- Date Range -->
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">From</label>
                <input type="date" id="tlStartDate"
                       class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-500 uppercase tracking-wide mb-1.5">To</label>
                <input type="date" id="tlEndDate"
                       class="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary">
            </div>

            <button onclick="resetTimelineFilters()"
                    class="px-4 py-2 bg-slate-200 text-slate-600 rounded-lg text-sm hover:bg-slate-300 transition-colors">
                Reset
            </button>
        </div>

        <!-- Summary -->
        <div class="mt-3 flex items-center gap-4 text-xs text-slate-400">
            <span id="tlSummary"></span>
        </div>
    </div>

    <!-- Timeline Chart -->
    <div id="timelineChart"></div>

    {% if not users %}
        <p class="text-slate-400 text-center py-12 text-sm">No assignments found for active users.</p>
    {% endif %}
</div>

<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {

    var rawUsers = {{ users|tojson|safe }};
    var timelineInstance = null;

    // ── Collect unique departments and projects for filter dropdowns ──
    var departments = {};
    var projects = {};
    rawUsers.forEach(function(u) {
        departments[u.department] = true;
        u.tasks.forEach(function(t) {
            projects[t.name] = t.color;
        });
    });

    // Populate department dropdown
    var deptSelect = document.getElementById('tlDeptFilter');
    Object.keys(departments).sort().forEach(function(d) {
        var opt = document.createElement('option');
        opt.value = d; opt.textContent = d;
        deptSelect.appendChild(opt);
    });

    // Populate project dropdown
    var projSelect = document.getElementById('tlProjectFilter');
    Object.keys(projects).sort().forEach(function(p) {
        var opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        projSelect.appendChild(opt);
    });

    // ── Build chart data from filtered users ──
    function buildChartData() {
        var empFilter = document.getElementById('tlEmployeeFilter').value.toLowerCase();
        var deptFilter = document.getElementById('tlDeptFilter').value;
        var statusFilter = document.getElementById('tlStatusFilter').value;
        var projFilter = document.getElementById('tlProjectFilter').value;
        var startFilter = document.getElementById('tlStartDate').value;
        var endFilter = document.getElementById('tlEndDate').value;

        // Filter users
        var filtered = rawUsers.filter(function(u) {
            if (deptFilter && u.department !== deptFilter) return false;
            if (empFilter && u.name.toLowerCase().indexOf(empFilter) === -1) return false;
            return true;
        });

        // Build series grouped by project
        var projectSeriesMap = {};
        var employeeSet = {};
        var totalAssignments = 0;

        filtered.forEach(function(user) {
            var label = user.name + ' (' + user.department + ')';

            user.tasks.forEach(function(task) {
                // Status filter
                if (statusFilter === 'active' && task.status !== 'Started') return;
                if (statusFilter === 'inactive' && task.status === 'Started') return;

                // Project filter
                if (projFilter && task.name !== projFilter) return;

                var taskStart = task.start;
                var taskEnd = task.end;

                // Date range filter: skip if assignment doesn't overlap with filter range
                if (startFilter && taskEnd < startFilter) return;
                if (endFilter && taskStart > endFilter) return;

                if (!projectSeriesMap[task.name]) {
                    projectSeriesMap[task.name] = {
                        name: task.name,
                        color: task.color,
                        data: []
                    };
                }

                projectSeriesMap[task.name].data.push({
                    x: label,
                    y: [new Date(taskStart).getTime(), new Date(taskEnd).getTime()],
                    fillColor: task.color
                });

                employeeSet[label] = true;
                totalAssignments++;
            });
        });

        var series = Object.keys(projectSeriesMap).map(function(k) {
            return projectSeriesMap[k];
        });

        var employeeCount = Object.keys(employeeSet).length;

        // Update summary
        document.getElementById('tlSummary').textContent =
            employeeCount + ' employee' + (employeeCount !== 1 ? 's' : '') +
            ' \u00B7 ' + totalAssignments + ' assignment' + (totalAssignments !== 1 ? 's' : '') +
            ' \u00B7 ' + series.length + ' project' + (series.length !== 1 ? 's' : '');

        return { series: series, employeeCount: employeeCount };
    }

    // ── Render the timeline ──
    function renderTimeline() {
        var result = buildChartData();
        var series = result.series;
        var employeeCount = result.employeeCount;

        if (timelineInstance) timelineInstance.destroy();

        var el = document.getElementById('timelineChart');

        if (series.length === 0 || employeeCount === 0) {
            el.innerHTML = '<div class="flex flex-col items-center justify-center py-16 text-slate-400">' +
                '<svg class="h-10 w-10 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>' +
                '<p class="text-sm">No assignments match the current filters</p></div>';
            return;
        }

        // Dynamic height: ~45px per employee row + padding for legend/axis
        var chartHeight = Math.max(300, employeeCount * 50 + 120);

        // Extract colors in series order
        var seriesColors = series.map(function(s) { return s.color || '#0d9488'; });

        timelineInstance = new ApexCharts(el, {
            chart: {
                type: 'rangeBar',
                height: chartHeight,
                fontFamily: 'Inter, system-ui, sans-serif',
                toolbar: {
                    show: true,
                    tools: {
                        download: true,
                        selection: false,
                        zoom: true,
                        zoomin: true,
                        zoomout: true,
                        pan: true,
                        reset: true
                    }
                },
                zoom: { enabled: true, allowMouseWheelZoom: false },
                animations: {
                    enabled: true,
                    easing: 'easeinout',
                    speed: 400
                }
            },
            plotOptions: {
                bar: {
                    horizontal: true,
                    barHeight: '60%',
                    rangeBarGroupRows: true,
                    borderRadius: 4
                }
            },
            series: series,
            colors: seriesColors,
            xaxis: {
                type: 'datetime',
                labels: {
                    style: { colors: '#94a3b8', fontSize: '11px' },
                    datetimeFormatter: { month: 'MMM \'yy', day: 'dd MMM' }
                },
                axisBorder: { color: '#e2e8f0' },
                axisTicks: { color: '#e2e8f0' }
            },
            yaxis: {
                labels: {
                    style: { colors: '#475569', fontSize: '12px', fontWeight: 500 },
                    maxWidth: 200
                }
            },
            grid: {
                borderColor: '#f1f5f9',
                xaxis: { lines: { show: true } },
                yaxis: { lines: { show: false } },
                padding: { left: 10, right: 20 }
            },
            legend: {
                position: 'top',
                horizontalAlign: 'left',
                fontSize: '12px',
                fontWeight: 500,
                labels: { colors: '#64748b' },
                markers: { width: 10, height: 10, radius: 3 },
                itemMargin: { horizontal: 12, vertical: 4 }
            },
            tooltip: {
                custom: function(opts) {
                    var seriesName = opts.w.config.series[opts.seriesIndex].name;
                    var data = opts.w.config.series[opts.seriesIndex].data[opts.dataPointIndex];
                    var employee = data.x;
                    var start = new Date(data.y[0]);
                    var end = new Date(data.y[1]);
                    var days = Math.round((end - start) / 86400000);
                    var color = data.fillColor || opts.w.config.colors[opts.seriesIndex];

                    var startStr = start.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
                    var endStr = end.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

                    return '<div style="padding:12px 16px; font-size:13px; line-height:1.6; font-family:Inter,system-ui,sans-serif;">' +
                        '<div style="font-weight:600; color:#1e293b; margin-bottom:6px;">' + employee + '</div>' +
                        '<div style="display:flex; align-items:center; gap:6px; margin-bottom:4px;">' +
                            '<span style="width:8px;height:8px;border-radius:2px;background:' + color + ';display:inline-block;"></span>' +
                            '<span style="color:#475569;">' + seriesName + '</span>' +
                        '</div>' +
                        '<div style="color:#94a3b8; font-size:12px;">' +
                            startStr + ' &rarr; ' + endStr +
                            '<span style="margin-left:8px; color:#64748b; font-weight:500;">' + days + ' days</span>' +
                        '</div>' +
                    '</div>';
                }
            },
            dataLabels: {
                enabled: true,
                formatter: function(val, opts) {
                    return opts.w.config.series[opts.seriesIndex].name;
                },
                style: {
                    fontSize: '11px',
                    fontWeight: 500,
                    fontFamily: 'Inter, system-ui, sans-serif',
                    colors: ['#fff']
                },
                dropShadow: { enabled: false }
            },
            stroke: { width: 0 }
        });
        timelineInstance.render();
    }

    // ── Filter event listeners ──
    var debounceTimer;
    document.getElementById('tlEmployeeFilter').addEventListener('input', function() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(renderTimeline, 300);
    });
    document.getElementById('tlDeptFilter').addEventListener('change', renderTimeline);
    document.getElementById('tlStatusFilter').addEventListener('change', renderTimeline);
    document.getElementById('tlProjectFilter').addEventListener('change', renderTimeline);
    document.getElementById('tlStartDate').addEventListener('change', renderTimeline);
    document.getElementById('tlEndDate').addEventListener('change', renderTimeline);

    function resetTimelineFilters() {
        document.getElementById('tlEmployeeFilter').value = '';
        document.getElementById('tlDeptFilter').value = '';
        document.getElementById('tlStatusFilter').value = 'active';
        document.getElementById('tlProjectFilter').value = '';
        document.getElementById('tlStartDate').value = '';
        document.getElementById('tlEndDate').value = '';
        renderTimeline();
    }
    window.resetTimelineFilters = resetTimelineFilters;

    // Initial render
    if (rawUsers.length > 0) {
        renderTimeline();
    }
});
</script>
{% endblock %}
