{% extends "base.html" %}

{% block content %}
<div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 mb-6">
    <div class="mb-8 border-b pb-4">
        <h1 class="text-3xl font-bold text-slate-800">Edit Assignment</h1>
        <p class="mt-2 text-sm text-slate-600">Update dates for {{ assignment.username }} on {{ assignment.project_name }}</p>
    </div>
    
    <form method="POST" id="editAssignmentForm" class="bg-slate-50 rounded-xl p-6">
        <input type="hidden" name="ret_user_filter" value="{{ user_filter }}">
        <input type="hidden" name="ret_project_filter" value="{{ project_filter }}">
        <input type="hidden" name="ret_page" value="{{ page }}">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">User</label>
                <select name="user_id" 
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                    {% for user in users %}
                    <option value="{{ user.id }}" {% if user.id == assignment.user_id %}selected{% endif %}>{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Project</label>
                <select name="project_id" 
                        class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                    {% for project in projects %}
                    <option value="{{ project.id }}" {% if project.id == assignment.project_id %}selected{% endif %}>{{ project.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Start Date</label>
                <input type="date" name="start_date" value="{{ assignment.start_date }}" required
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">End Date</label>
                <input type="date" name="end_date" value="{{ assignment.end_date }}" required
                    class="w-full px-4 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-primary focus:border-primary transition-all">
            </div>
        </div>
        
        <button type="button" 
                id="confirmSaveButton"
                class="inline-flex items-center px-6 py-3 border border-transparent text-sm font-medium rounded-md text-white bg-primary hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors">
            Save Changes
        </button>
    </form>
</div>

<!-- Confirmation Modal -->
<div id="confirmationModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
    <div class="bg-white rounded-lg p-6 w-96">
        <h3 class="text-lg font-semibold text-slate-800 mb-4">Confirm Changes</h3>
        <p class="text-slate-600 mb-6">Are you sure you want to save these changes?</p>
        <div class="flex justify-end space-x-3">
            <button type="button" id="cancelButton" class="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded transition-colors">Cancel</button>
            <button type="button" id="confirmButton" class="px-4 py-2 bg-primary text-white rounded hover:bg-primary-700 transition-colors">Confirm</button>
        </div>
    </div>
</div>

<script>
    const confirmSaveButton = document.getElementById('confirmSaveButton');
    const cancelButton = document.getElementById('cancelButton');
    const confirmButton = document.getElementById('confirmButton');
    const modal = document.getElementById('confirmationModal');
    const form = document.getElementById('editAssignmentForm');

    confirmSaveButton.addEventListener('click', () => {
        modal.classList.remove('hidden');
    });

    cancelButton.addEventListener('click', () => {
        modal.classList.add('hidden');
    });

    confirmButton.addEventListener('click', () => {
        form.submit();
    });
</script>
{% endblock %}
